version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fastpick-db
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fastpick-network

  redis:
    image: redis:7-alpine
    container_name: fastpick-redis
    ports:
      - "6379:6379"
    env_file: .env
    command:
      redis-server 
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 512mb 
      --maxmemory-policy allkeys-lru
    networks:
      - fastpick-network

volumes:
  postgres_data:

networks:
  fastpick-network:
    driver: bridge